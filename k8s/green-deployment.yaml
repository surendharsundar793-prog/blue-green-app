apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-deployment
  labels:
    app: blue-green-app
    version: green
spec:
  replicas: 2

  selector:
    matchLabels:
      app: blue-green-app
      version: green

  template:
    metadata:
      labels:
        app: blue-green-app
        version: green

    spec:
      containers:
        - name: green-app
          image: surendharr/blue-green-app:PLACEHOLDER

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
